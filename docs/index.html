<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホームズプロジェクト</title>
    <style>
        /* ページ全体 */
        body {
            margin: 0;
            padding: 40px 20px;
            background: #f5efe6;
            color: #3b2f2a;
            font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
            line-height: 1.8;
        }

        /* 中央のカード */
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 40px;
            background: #fffaf3;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(59, 47, 42, 0.12);
        }

        h1 {
            margin: 0 0 32px;
            font-size: 1.8rem;
            text-align: center;
            color: #6b4226;
            letter-spacing: 0.05em;
        }

        h2 {
            margin: 32px 0 16px;
            padding-left: 12px;
            font-size: 1.3rem;
            border-left: 5px solid #c08552;
        }

        /* 日記の各項目 */
        p {
            margin: 0 0 12px;
            padding: 14px 18px;
            background: #f3e6d8;
            border-radius: 10px;
            cursor: default;
        }

        /* 講義リンク */
        .lecture-link {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 14px 18px;
            background: #6b4226;
            color: #fffaf3;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
        }
        .lecture-link .no {
            padding: 2px 10px;
            background: #c08552;
            border-radius: 999px;
            font-size: 0.85rem;
        }
        .lecture-link .arrow {
            margin-left: auto;
        }

        /* アニメーション前のちらつき防止 */
        h1, h2, p, .lecture-link {
            opacity: 0;
        }

        /* スマホ向けの調整 */
        @media (max-width: 480px) {
            main {
                padding: 24px;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>これはホームズプロジェクトです。</h1>

        <h2>講義</h2>
        <a class="lecture-link" href="lectures/001-static-web-loading.html">
            <span class="no">001</span>
            <span>静的Webページの読み込み</span>
            <span class="arrow">→</span>
        </a>
        <a class="lecture-link" href="lectures/002-git-add-commit-push.html">
            <span class="no">002</span>
            <span>git add・commit・push</span>
            <span class="arrow">→</span>
        </a>
        <a class="lecture-link" href="lectures/003-dom-overview.html">
            <span class="no">003</span>
            <span>DOMってなに？</span>
            <span class="arrow">→</span>
        </a>

        <h2>日記</h2>
        <p>朝にコーヒーを飲んだ。</p>
        <p>朝にワッフルとドーナツを食べた。</p>
        <p>昼にカップラーメンを食べた。</p>
        <p>夜にマグロ丼を食べた。</p>
    </main>

    <script type="module">
        import { animate, stagger, hover, press } from "https://cdn.jsdelivr.net/npm/motion@14.13.0/+esm";

        // ===== タイトル：1文字ずつ分解して飛び込ませる =====
        const h1 = document.querySelector("h1");
        h1.innerHTML = [...h1.textContent]
            .map((c) => `<span style="display:inline-block;opacity:0">${c}</span>`)
            .join("");
        h1.style.opacity = 1;

        animate(
            "h1 span",
            { opacity: [0, 1], y: [-120, 0], rotate: [-180, 0], scale: [0.2, 1] },
            { type: "spring", bounce: 0.6, duration: 1, delay: stagger(0.05) }
        );

        // タイトル：登場後、文字が波打ち続ける
        animate(
            "h1 span",
            { y: [0, -14, 0] },
            { duration: 0.5, repeat: Infinity, repeatDelay: 1.2, delay: stagger(0.05, { startDelay: 2.5 }) }
        );

        // ===== 見出し：横から勢いよくスライド =====
        animate(
            "h2",
            { opacity: [0, 1], x: [-250, 0], scale: [1.6, 1], rotate: [-15, 0] },
            { type: "spring", bounce: 0.55, duration: 0.9, delay: stagger(0.3, { startDelay: 0.8 }) }
        );

        // ===== 講義リンク：下から1つずつ跳ねて登場 =====
        animate(
            ".lecture-link",
            { opacity: [0, 1], y: [60, 0], scale: [0.6, 1] },
            { type: "spring", bounce: 0.5, duration: 0.9, delay: stagger(0.15, { startDelay: 1.1 }) }
        );

        hover(".lecture-link", (el) => {
            const arrow = el.querySelector(".arrow");
            animate(el, { scale: 1.04 }, { type: "spring", stiffness: 400, damping: 10 });
            animate(arrow, { x: 6 }, { type: "spring", stiffness: 400, damping: 10 });
            return () => {
                animate(el, { scale: 1 }, { type: "spring", stiffness: 400, damping: 10 });
                animate(arrow, { x: 0 }, { type: "spring", stiffness: 400, damping: 10 });
            };
        });

        // ===== 日記：左右交互に回転しながら突っ込んでくる =====
        document.querySelectorAll("p").forEach((el, i) => {
            const dir = i % 2 === 0 ? -1 : 1;
            animate(
                el,
                { opacity: [0, 1], x: [400 * dir, 0], rotate: [30 * dir, 0], scale: [0.5, 1] },
                { type: "spring", bounce: 0.5, duration: 1, delay: 1.6 + i * 0.25 }
            );
        });

        // 日記：ホバーで拡大＆傾く
        hover("p", (el) => {
            animate(el, { scale: 1.08, rotate: -2, x: 10 }, { type: "spring", stiffness: 400, damping: 8 });
            return () => animate(el, { scale: 1, rotate: 0, x: 0 }, { type: "spring", stiffness: 400, damping: 8 });
        });

        // 日記：クリックでブルブル震える
        press("p", (el) => {
            animate(
                el,
                { x: [0, -14, 14, -10, 10, -5, 5, 0], rotate: [0, -4, 4, -3, 3, 0] },
                { duration: 0.5 }
            );
        });
    </script>
</body>
</html>
