<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホームズプロジェクト</title>
    <style>
        /* ページ全体 */
        body {
            margin: 0;
            padding: 40px 20px;
            background: #f5efe6;
            color: #3b2f2a;
            font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
            line-height: 1.8;
        }

        /* 中央のカード */
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 40px;
            background: #fffaf3;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(59, 47, 42, 0.12);
        }

        h1 {
            margin: 0 0 32px;
            font-size: 1.8rem;
            text-align: center;
            color: #6b4226;
            letter-spacing: 0.05em;
        }

        h2 {
            margin: 0 0 16px;
            padding-left: 12px;
            font-size: 1.3rem;
            border-left: 5px solid #c08552;
        }

        /* 日記の各項目 */
        p {
            margin: 0 0 12px;
            padding: 14px 18px;
            background: #f3e6d8;
            border-radius: 10px;
            cursor: default;
        }

        /* アニメーション前のちらつき防止 */
        h1, h2, p {
            opacity: 0;
        }

        /* スマホ向けの調整 */
        @media (max-width: 480px) {
            main {
                padding: 24px;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>これはホームズプロジェクトです。</h1>
        <h2>日記</h2>
        <p>朝にコーヒーを飲んだ。</p>
        <p>朝にワッフルとドーナツを食べた。</p>
    </main>

    <script type="module">
        import { animate, stagger, hover } from "https://cdn.jsdelivr.net/npm/motion@14.13.0/+esm";

        // タイトル：上からフェードイン
        animate("h1", { opacity: [0, 1], y: [-20, 0] }, { duration: 0.8 });

        // 見出し：少し遅れて表示
        animate("h2", { opacity: [0, 1] }, { delay: 0.4, duration: 0.6 });

        // 日記：左から1つずつ順番に表示
        animate(
            "p",
            { opacity: [0, 1], x: [-30, 0] },
            { delay: stagger(0.15, { startDelay: 0.6 }), duration: 0.5 }
        );

        // 日記：マウスを乗せると右にずれる（バネの動き）
        hover("p", (el) => {
            animate(el, { x: 8 }, { type: "spring", stiffness: 300 });
            return () => animate(el, { x: 0 }, { type: "spring", stiffness: 300 });
        });
    </script>
</body>
</html>
