<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blendy — Real fruit smoothies</title>
<style>
@font-face{font-family:"Poppins";font-style:normal;font-weight:500;font-display:swap;src:url(https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLGT9Z1xlFQ.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-style:normal;font-weight:600;font-display:swap;src:url(https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLEj6Z1xlFQ.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-style:normal;font-weight:700;font-display:swap;src:url(https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLCz7Z1xlFQ.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:800;font-display:swap;src:url(https://fonts.gstatic.com/s/baloo2/v23/wXK0E3kTposypRydzVT08TS3JnAmtdiayppo_lc.woff2) format("woff2")}

:root{--u:1px;--fy:0px;--n:clamp(0.5px,min(calc(100vw / 1440),calc(100vh / 900)),1.3px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#C2B0DC;font-family:Poppins,system-ui,sans-serif;color:#fff;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;touch-action:pan-y}

/* stage */
.stage{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0;overflow:hidden;visibility:hidden;z-index:0}
.slide.is-current{visibility:visible;z-index:2}
.frame{position:absolute;width:calc(var(--u)*1440);height:calc(var(--u)*900);
  left:calc(50% - var(--u)*720);top:calc(50% - var(--u)*450 + var(--fy))}
.layer{position:absolute;inset:0;will-change:transform}
.word{position:absolute;left:0;width:calc(var(--u)*1440);text-align:center;font-weight:700;
  line-height:1;white-space:nowrap;color:#fff}
.shadow{position:absolute;border-radius:50%;
  background:radial-gradient(closest-side,rgba(60,40,80,.22),rgba(60,40,80,0));filter:blur(calc(var(--u)*4))}
.bottle,.piece{position:absolute}
.crop{background-repeat:no-repeat}
.bob{width:100%;height:100%;background-repeat:no-repeat;
  animation:bob var(--dur,4s) ease-in-out var(--del,0s) infinite alternate;transform:rotate(var(--r,0deg))}
.corner .piece{filter:blur(calc(var(--u)*9))}
@keyframes bob{
  from{transform:translateY(calc(var(--u)*-7)) rotate(calc(var(--r,0deg) - 3deg))}
  to{transform:translateY(calc(var(--u)*7)) rotate(calc(var(--r,0deg) + 3deg))}
}

/* UI */
.ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.ui a,.ui button{pointer-events:auto;background:none;border:0;color:#fff;font:inherit;text-decoration:none;cursor:pointer}
.ui a,.ui button,.ui span{text-shadow:0 1px 6px rgba(90,70,40,.18)}
.header{position:absolute;left:calc(var(--n)*50);right:calc(var(--n)*50);top:calc(var(--n)*26);
  height:calc(var(--n)*50);display:flex;align-items:center}
.logo{font-family:"Baloo 2",Poppins,system-ui,sans-serif;font-weight:800;font-size:calc(var(--n)*51);
  letter-spacing:-.02em;line-height:1}
.tabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:calc(var(--n)*88);
  font-weight:500;font-size:calc(var(--n)*21)}
.tabs button{padding:calc(var(--n)*6) 0;line-height:1.5;white-space:nowrap}
.underline{position:absolute;left:0;top:calc(100% + var(--n)*2);height:2px;width:0;border-radius:2px;
  background:#fff;transition:transform .6s cubic-bezier(.65,0,.35,1),width .6s cubic-bezier(.65,0,.35,1)}
.account{margin-left:auto;display:flex;align-items:center;gap:calc(var(--n)*22);font-weight:500;font-size:calc(var(--n)*21)}
.account .sep{opacity:.9}
.shop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--n)*36);font-weight:600;
  font-size:calc(var(--n)*21);letter-spacing:.2em;padding:calc(var(--n)*10) calc(var(--n)*16);line-height:1.5;white-space:nowrap}
.arrow{position:absolute;bottom:calc(var(--n)*30);width:calc(var(--n)*52);height:calc(var(--n)*52);
  display:flex;align-items:center;justify-content:center}
.arrow.prev{left:calc(var(--n)*36)}
.arrow.next{right:calc(var(--n)*36)}
.arrow svg{width:calc(var(--n)*28);height:calc(var(--n)*28);display:block;overflow:visible;
  filter:drop-shadow(0 1px 6px rgba(90,70,40,.18))}

/* opening */
html.intro .stage{visibility:hidden}
html.intro .rise{opacity:0;translate:0 14px}

/* tablet & mobile */
@media (max-width:820px),(orientation:portrait){
  :root{--n:1px}
  .header{left:20px;right:20px;top:16px;height:40px}
  .logo{font-size:34px}
  .account{font-size:15px;gap:10px}
  .tabs{top:36px;transform:translateX(-50%);gap:22px;font-size:15px}
  .shop{font-size:15px;bottom:22px}
  .arrow{width:48px;height:48px;bottom:12px}
  .arrow.prev{left:8px}.arrow.next{right:8px}
  .arrow svg{width:24px;height:24px}
}

@media (prefers-reduced-motion:reduce){
  .bob{animation:none;transform:rotate(var(--r,0deg))}
  .underline{transition:none}
}
</style>
</head>
<body>
<main class="stage" id="stage" aria-live="polite"></main>

<div class="ui">
  <header class="header">
    <a href="#" class="logo rise" data-delay="250">Blendy</a>
    <nav class="tabs rise" data-delay="330" id="tabs" aria-label="Flavours">
      <button type="button">Berry</button>
      <button type="button">Kiwi</button>
      <button type="button">Banana</button>
      <button type="button">Strawberry</button>
      <span class="underline" id="underline" aria-hidden="true"></span>
    </nav>
    <div class="account rise" data-delay="410">
      <a href="#">Cart</a><span class="sep">|</span><a href="#">Register</a>
    </div>
  </header>
  <button type="button" class="arrow prev rise" data-delay="490" id="prev" aria-label="Previous flavour">
    <svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 14H4 M12 6l-8 8 8 8"/></svg>
  </button>
  <a href="#" class="shop rise" data-delay="570">SHOP NOW</a>
  <button type="button" class="arrow next rise" data-delay="650" id="next" aria-label="Next flavour">
    <svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h20 M16 6l8 8-8 8"/></svg>
  </button>
</div>

<script>
(function(){
"use strict";
var root=document.documentElement;
var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var mobileMQ=window.matchMedia("(max-width: 820px), (orientation: portrait)");
if(!reduced) root.classList.add("intro");

var PROXY="https://images.higgs.ai/?default=1&output=webp&w=2048&q=85&url=";
var BASE="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/";
function sheet(id){return PROXY+encodeURIComponent(BASE+id+".png");}

var FLAVOURS=[
 {word:"Berry",color:"#C2B0DC",sheet:sheet("hf_20261117_053958_8803e421-29b1-4c24-8efd-54cae3f479b4"),
  items:[[233,60,598,917],[1209,272,569,573],[265,1230,579,572],[1192,1192,626,641]],
  bottle:[518,138,372],
  pieces:[[2,383,178,104,0,0,"fruit"],[3,960,232,118,0,0,"fruit"],[1,295,478,129,-8,0,"fruit"],[1,1247,455,123,15,0,"fruit"],[2,968,590,110,30,0,"fruit"],[1,-15,590,255,0,0,"corner"],[3,1282,40,200,0,0,"corner"]]},
 {word:"Kiwi",color:"#B4D58A",sheet:sheet("hf_20261117_053958_b5695e60-72da-4b5b-bfb7-a091d528af75"),
  items:[[217,90,610,874],[1204,257,619,601],[250,1197,619,522],[1200,1186,633,650]],
  bottle:[504,135,403],
  pieces:[[2,376,170,144,-150,1,"fruit"],[3,960,228,152,0,0,"fruit"],[1,303,460,168,0,0,"fruit"],[2,1187,462,148,-25,0,"fruit"],[2,946,606,150,10,1,"fruit"],[1,-10,575,260,0,0,"corner"],[3,1285,30,200,0,0,"corner"]]},
 {word:"Banana",color:"#F3DA8A",sheet:sheet("hf_20261117_053958_6cf14029-4bce-4c9a-b9fc-1c5b185082e3"),
  items:[[194,76,579,873],[1205,228,596,597],[230,1181,624,648],[1193,1182,646,659]],
  bottle:[512,135,383],
  pieces:[[1,387,147,123,0,0,"fruit"],[2,970,223,136,-10,1,"fruit"],[3,298,483,132,15,0,"fruit"],[2,1245,462,150,20,0,"fruit"],[3,950,582,130,-12,0,"fruit"],[3,0,585,235,0,0,"corner"],[1,1280,30,190,0,0,"corner"]]},
 {word:"Strawberry",color:"#F2AFC0",sheet:sheet("hf_20261117_055135_cbfb5a8d-c52b-4358-a6ee-d941c6c42285"),
  items:[[226,88,594,887],[1190,216,561,653],[257,1168,604,662],[1240,1169,632,686]],
  bottle:[512,135,386],
  pieces:[[1,372,142,128,0,0,"fruit"],[2,955,225,117,20,0,"fruit"],[3,290,455,140,-10,0,"fruit"],[3,1250,432,135,15,0,"fruit"],[2,962,558,146,-15,0,"fruit"],[1,-10,555,245,0,0,"corner"],[1,1285,35,200,20,0,"corner"]]}
];
var SHADOWS=[[345,650,170,24],[720,708,320,30],[1318,638,160,22],[1045,760,150,22]];
var LAYERS=["word","shadow","bottle","fruit","corner"];
var FACT=[0.40,0.30,0.15,0.55,0.75];

function U(v){return "calc(var(--u) * "+(+v.toFixed(4))+")";}
function box(el,x,y,w,h){el.style.left=U(x);el.style.top=U(y);el.style.width=U(w);el.style.height=U(h);}
function crop(el,url,b,W){
  var s=W/b[2];
  el.style.backgroundImage='url("'+url+'")';
  el.style.backgroundSize=U(2048*s)+" "+U(2048*s);
  el.style.backgroundPosition=U(-b[0]*s)+" "+U(-b[1]*s);
  el.style.backgroundRepeat="no-repeat";
  return b[3]*s;
}
function div(cls,parent){var d=document.createElement("div");d.className=cls;if(parent)parent.appendChild(d);return d;}

/* build slides */
var stage=document.getElementById("stage");
var slides=FLAVOURS.map(function(f,i){
  var sec=document.createElement("section");
  sec.className="slide";sec.style.background=f.color;sec.setAttribute("aria-label",f.word);
  var frame=div("frame",sec);
  var L={};LAYERS.forEach(function(n){L[n]=div("layer "+n,frame);});
  var word=div("word",L.word);word.textContent=f.word;
  SHADOWS.forEach(function(s){box(div("shadow",L.shadow),s[0]-s[2]/2,s[1]-s[3]/2,s[2],s[3]);});
  var b=div("bottle crop",L.bottle);var bh=crop(b,f.sheet,f.items[0],f.bottle[2]);
  box(b,f.bottle[0],f.bottle[1],f.bottle[2],bh);
  f.pieces.forEach(function(p){
    var it=f.items[p[0]],W=p[3],h=it[3]*W/it[2];
    var outer=div("piece",L[p[6]]);box(outer,p[1],p[2],W,h);
    if(p[5])outer.style.transform="scaleX(-1)";
    var inner=div("bob",outer);crop(inner,f.sheet,it,W);
    inner.style.setProperty("--r",p[4]+"deg");
    inner.style.setProperty("--dur",(3.2+Math.random()*1.8).toFixed(2)+"s");
    inner.style.setProperty("--del",(-Math.random()*4).toFixed(2)+"s");
  });
  stage.appendChild(sec);
  return {el:sec,word:word,layers:LAYERS.map(function(n){return L[n];}),text:f.word};
});

/* if the proxy fails, fall back to the original PNG */
FLAVOURS.forEach(function(f,i){
  var direct=decodeURIComponent(f.sheet.split("url=")[1]);
  var img=new Image();
  img.onerror=function(){
    slides[i].el.querySelectorAll(".crop,.bob").forEach(function(el){el.style.backgroundImage='url("'+direct+'")';});
  };
  img.src=f.sheet;
});

var cur=0,busy=false,u=1;
slides[0].el.classList.add("is-current");

/* scaling + word sizing */
var cv=document.createElement("canvas").getContext("2d");
function layoutWords(){
  var mob=mobileMQ.matches;
  var visible=mob?Math.min(1440,innerWidth/u)*0.92:1400;
  var limit=mob?visible:1330;
  cv.font='700 100px Poppins';
  slides.forEach(function(s){
    var m=cv.measureText(s.text);
    var w100=(m.actualBoundingBoxLeft||0)+(m.actualBoundingBoxRight||m.width);
    var F=445,ls=0.005;
    if(w100*4.45>limit){ls=-0.035;F=Math.min(445,visible*100/w100);}
    var baseline=403.5+0.698*F/2,top=baseline-0.85*F;
    s.word.style.fontSize=U(F);s.word.style.top=U(top);
    s.word.style.letterSpacing=ls+"em";s.word.style.textIndent=ls+"em";
  });
}
function layout(){
  var W=innerWidth,H=innerHeight,mob=mobileMQ.matches;
  u=mob?Math.min(W/640,Math.max(1,H-200)/620):Math.min(W/1440,H/900);
  root.style.setProperty("--u",u+"px");
  root.style.setProperty("--fy",(mob?8:0)+"px");
  layoutWords();placeUnderline();
}

/* tabs / underline */
var tabs=[].slice.call(document.querySelectorAll("#tabs button"));
var underline=document.getElementById("underline");
var activeTab=0;
function placeUnderline(){
  var t=tabs[activeTab];
  underline.style.width=t.offsetWidth+"px";
  underline.style.transform="translateX("+t.offsetLeft+"px)";
}
function setActive(i){
  activeTab=i;
  tabs.forEach(function(t,j){if(j===i)t.setAttribute("aria-current","true");else t.removeAttribute("aria-current");});
  placeUnderline();
}

/* coverage curve */
var CT=[0,.031,.134,.206,.278,.34,.412,.485,.546,.583,.62,.69,.79,.85,.93,1];
var CC=[0,.006,.012,.023,.047,.07,.105,.158,.246,.55,.825,.9,.94,.956,.975,1];
function cover(t){
  if(t<=0)return 0;if(t>=1)return 1;
  for(var i=1;i<CT.length;i++){
    if(t<=CT[i]){var k=(t-CT[i-1])/(CT[i]-CT[i-1]);k=k*k*(3-2*k);return CC[i-1]+(CC[i]-CC[i-1])*k;}
  }
  return 1;
}
function clearSlide(s){
  s.el.style.clipPath="";s.el.style.webkitClipPath="";s.el.style.zIndex="";s.el.style.visibility="";
  s.layers.forEach(function(l){l.style.transform="";});
}

function go(to,dir){
  if(busy||to===cur)return;
  var A=slides[cur],B=slides[to];
  setActive(to);
  if(reduced){
    A.el.classList.remove("is-current");B.el.classList.add("is-current");cur=to;return;
  }
  busy=true;
  var fw0=1440*u;
  B.layers.forEach(function(l,i){l.style.transform="translate3d("+(dir*FACT[i]*fw0)+"px,0,0)";});
  B.el.style.visibility="visible";B.el.style.zIndex="1";A.el.style.zIndex="2";
  var t0=performance.now();
  function frame(now){
    var t=Math.min(1,(now-t0)/970),c=cover(t),fw=1440*u;
    var clip=dir>0?"inset(0 "+(c*100)+"% 0 0)":"inset(0 0 0 "+(c*100)+"%)";
    A.el.style.clipPath=clip;A.el.style.webkitClipPath=clip;
    var ax=-dir*c*0.14*fw;
    A.layers.forEach(function(l){l.style.transform="translate3d("+ax+"px,0,0)";});
    var k=Math.max(0,Math.min(1,(t-0.5)/0.42));k=1-(1-k)*(1-k);
    B.layers.forEach(function(l,i){l.style.transform="translate3d("+(dir*(1-k)*FACT[i]*fw)+"px,0,0)";});
    if(t<1){requestAnimationFrame(frame);return;}
    A.el.classList.remove("is-current");B.el.classList.add("is-current");
    slides.forEach(clearSlide);cur=to;busy=false;
  }
  requestAnimationFrame(frame);
}
function next(){go((cur+1)%4,1);}
function prev(){go((cur+3)%4,-1);}

/* controls */
var lastInteract=-Infinity;
function touch(){lastInteract=Date.now();}
tabs.forEach(function(t,i){t.addEventListener("click",function(){touch();if(i!==cur)go(i,i>cur?1:-1);});});
document.getElementById("next").addEventListener("click",function(){touch();next();});
document.getElementById("prev").addEventListener("click",function(){touch();prev();});
document.querySelectorAll('.ui a[href="#"]').forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();});});
addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"){touch();next();}else if(e.key==="ArrowLeft"){touch();prev();}
});
var sx=null,sy=0;
stage.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY;});
addEventListener("pointerup",function(e){
  if(sx===null)return;var dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){touch();if(dx<0)next();else prev();}
});
addEventListener("pointercancel",function(){sx=null;});
setInterval(function(){
  if(document.visibilityState==="visible"&&Date.now()-lastInteract>6000&&!busy)next();
},2600);

addEventListener("resize",layout);
if(mobileMQ.addEventListener)mobileMQ.addEventListener("change",layout);
layout();setActive(0);

/* opening sequence */
var EASE="cubic-bezier(0.22, 0.8, 0.3, 1)",revealed=false;
function reveal(){
  if(revealed)return;revealed=true;
  layout();
  if(reduced){root.classList.remove("intro");return;}
  var fw=1440*u;busy=true;
  slides[0].layers.forEach(function(l,i){
    l.animate([{transform:"translateX("+(FACT[i]*fw)+"px)"},{transform:"translateX(0)"}],{duration:900,easing:EASE});
  });
  setTimeout(function(){busy=false;},900);
  document.querySelectorAll(".rise").forEach(function(el){
    try{
      el.animate([{opacity:0,translate:"0 14px"},{opacity:1,translate:"0 0"}],
        {duration:1000,delay:+el.dataset.delay,easing:EASE,fill:"backwards"});
    }catch(err){}
  });
  root.classList.remove("intro");
}
setTimeout(function(){reveal();root.classList.remove("intro");},3000);
if(document.fonts&&document.fonts.ready){
  Promise.all([document.fonts.load('700 100px Poppins'),document.fonts.ready]).then(reveal,reveal);
}else reveal();
})();
</script>
</body>
</html>
